
spring:
  application:
    name: license-query-service

  cloud:
    config:
      uri: http://localhost:9000
      profile: dev
      enabled: true

eureka:
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka


springdoc:
  api-docs:
    path: /query-license/v3/api-docs
  swagger-ui:
    path: /swagger-ui.html


