version: '3.9'

services:

  mongo-service:
    image: mongo
    container_name: bd-mongo_licencia_conducir
    environment:
      MONGO_INITDB_ROOT_USERNAME: test
      MONGO_INITDB_ROOT_PASSWORD: secret123
    ports:
      - 27017:27017
    networks:
      - licencia_conducir

  mongo-express:
    image: mongo-express
    container_name: bd-mongo-express_licencia_conducir
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: test
      ME_CONFIG_MONGODB_ADMINPASSWORD: secret123
      ME_CONFIG_MONGODB_URL: mongodb://test:secret123@mongo-service:27017
    networks:
      - licencia_conducir

  postgres-licencia_conducir:
    image: postgres:13.1-alpine
    container_name: licencia_conducir-postgresql
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: licencia_conducir
    networks:
      - licencia_conducir

  prometheus:
    image: prom/prometheus
    container_name: licencia_conducir-prometheus
    ports:
      - 9090:9090
    volumes: 
      - ./prometheus/config/:/etc/prometheus/
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - licencia_conducir

  grafana:
    image: grafana/grafana-oss
    container_name: licencia_conducir-grafana
    ports:
      - 3000:3000
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_DOMAIN=localhost
    networks:
      - licencia_conducir

  loki:
    image: grafana/loki
    container_name: licencia_conducir-loki
    ports:
      - 3100:3100
    networks:
      - licencia_conducir

  zipkin:
    image: ghcr.io/openzipkin/zipkin-slim
    container_name: licencia_conducir-zipkin
    environment:
      - STORAGE_TYPE=mem
    ports:
      - 9411:9411
    networks:
      - licencia_conducir

  zookeeper:
    image: confluentinc/cp-zookeeper
    container_name: license-kafka-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - licencia_conducir
      
  broker:
    image: confluentinc/cp-kafka
    container_name: license-kafka-broker
    ports:
      - 9092:9092
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT, PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092, PLAINTEXT_INTERNAL://broker:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_REPLICATION_FACTOR: 1
    networks:
      - licencia_conducir

networks:
  licencia_conducir:
    name: licencia_conducir-network